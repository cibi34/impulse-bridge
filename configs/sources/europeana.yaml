collection:
  id: europeana-public-domain-images
  name: "Europeana Public Domain Images"
  description: "Open-licensed images aggregated from European cultural heritage institutions via Europeana."
  organization: "Europeana Foundation"
  owner_id: "bridge@impulse.eu"
  published: 1

adapter:
  kind: rest
  base_url: "https://api.europeana.eu"
  auth:
    type: query_param
    name: wskey
    value: "${EUROPEANA_API_KEY}"
  timeout_seconds: 15
  default_query:
    reusability: "open"      # PD-eligible + open-licensed only
    media: "true"            # only items with downloadable media
    qf: "TYPE:IMAGE"         # filter to images
    profile: "rich"          # include full metadata in the response

search:
  path: "/record/v2/search.json"
  method: GET
  pagination:
    # `start` is the position of the first record (1-based), not a page number.
    style: offset_limit
    offset_param: start
    limit_param: rows
    offset_base: 1
    max_size: 100
  query:
    pattern_param: query
    pattern_when_empty: "*"  # match everything

mapping:
  items_path: "items"
  total_path: "totalResults"
  fields:
    assetID:
      expr: "id"
      transform: slugify
    title:
      expr: "title[0]"
      default: "Untitled"
    description:
      expr: "dcDescription[0]"
      transform: strip_html
    creator:
      # dcCreator mixes names and authority URIs (GND, Europeana agents): take
      # the first name, else the label of the first linked agent.
      expr: "(dcCreator[?!starts_with(@, 'http')] | [0]) || edmAgentLabel[0].def"
    date:
      expr: "year[0]"
    rights:
      expr: "rights[0]"
      default: "See source for license"
    identifier:
      expr: "guid"
    assetURI:
      expr: "edmIsShownBy[0]"
    previewURI:
      expr: "edmPreview[0]"
    contentType:
      literal: "image/jpeg"  # we filtered TYPE:IMAGE; mime is not exposed reliably
    contributor:
      expr: "dataProvider[0]"
    scale:
      literal: "1"
    subject:
      expr: "dcSubject[0]"
    language:
      expr: "dcLanguage[0]"

filter:
  allowed_content_types:
    - "image/jpeg"
    - "image/png"
  drop_if_missing:
    - "assetURI"
    - "previewURI"

asset_detail:
  enabled: true
  # Europeana's Record API (/record/v2/{id}.json) needs the exact, case-
  # sensitive record id ("/90402/SK_A_3262"). Our assetID is that id slugified
  # ("90402-sk-a-3262"), which cannot be reversed. So instead of the Record
  # API we ask the Search API for the record whose europeana_id matches the
  # assetID case-insensitively, via a Solr regular expression that the bridge
  # derives from the assetID ({asset_id_regex}). The response has the same
  # shape as a search response, so the search mapping above is reused.
  path: "/record/v2/search.json"
  query:
    query: "europeana_id:/{asset_id_regex}/"
    profile: "rich"
    rows: "1"

cache:
  ttl_seconds: 900
