<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impulse Bridge — Documentation</title>
<script>
  (function () {
    var t = localStorage.getItem("impulse-bridge-theme");
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  })();
</script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1f2532;
    --border: #2a3142;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #5ea1ff;
    --accent-2: #79e0c4;
    --danger: #ff7676;
    --code-bg: #1f2532;
    --code-border: #2a3142;
    --table-stripe: rgba(255,255,255,0.02);
  }
  :root[data-theme="light"] {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --panel-2: #eef1f6;
    --border: #d9dee8;
    --text: #1c2330;
    --muted: #5d6678;
    --accent: #2563eb;
    --accent-2: #0d9488;
    --danger: #dc2626;
    --code-bg: #f1f3f7;
    --code-border: #d9dee8;
    --table-stripe: rgba(15,30,60,0.025);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 18px; flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
  header .tag { color: var(--muted); font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: 12px; align-items: center; }
  header nav a { color: var(--muted); }
  header nav a:hover { color: var(--text); }
  header nav button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }

  .layout { display: flex; flex: 1; min-height: 0; }

  aside {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--panel); overflow-y: auto; padding: 16px 8px;
  }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 0 10px; margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .doc-item {
    padding: 7px 12px; border-radius: 5px; cursor: pointer;
    color: var(--text); display: block; text-decoration: none;
  }
  .doc-item:hover { background: var(--panel-2); text-decoration: none; }
  .doc-item.active { background: var(--panel-2); color: var(--accent); }
  .doc-item .num { color: var(--muted); margin-right: 8px; font-size: 12px; }

  main { flex: 1; overflow-y: auto; padding: 36px 48px; max-width: 100%; }
  .content { max-width: 880px; margin: 0 auto; }

  /* Markdown styling */
  .content h1 { font-size: 28px; margin: 0 0 14px; font-weight: 700; letter-spacing: -0.3px; }
  .content h2 { font-size: 20px; margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .content h3 { font-size: 16px; margin: 22px 0 10px; font-weight: 600; }
  .content h4 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; color: var(--muted); }
  .content p { margin: 10px 0; }
  .content ul, .content ol { padding-left: 22px; margin: 10px 0; }
  .content li { margin: 4px 0; }
  .content hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
  .content blockquote { border-left: 3px solid var(--accent); margin: 12px 0; padding: 4px 14px; color: var(--muted); background: var(--panel); border-radius: 0 4px 4px 0; }
  .content em { font-style: italic; color: var(--muted); }
  .content strong { font-weight: 600; }

  .content code {
    background: var(--code-bg); border: 1px solid var(--code-border);
    padding: 1px 6px; border-radius: 4px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em;
  }
  .content pre {
    background: var(--code-bg); border: 1px solid var(--code-border);
    padding: 14px 16px; border-radius: 6px; overflow-x: auto; margin: 14px 0;
    line-height: 1.45;
  }
  .content pre code { background: transparent; border: 0; padding: 0; font-size: 12px; }

  .content table { border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 13px; }
  .content th, .content td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  .content th { font-weight: 600; background: var(--panel); }
  .content tr:nth-child(even) td { background: var(--table-stripe); }

  .content img { max-width: 100%; }

  .nav-foot { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); }
  .nav-foot a { padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px; }

  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .error-box { padding: 16px; background: var(--panel); border: 1px solid var(--danger); border-radius: 6px; color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>Impulse Bridge — Documentation</h1>
  <span class="tag">v0.1</span>
  <nav>
    <button id="themeBtn" title="Toggle theme"></button>
    <a href="/admin">Admin →</a>
    <a href="/">Browser →</a>
    <a href="/docs">API</a>
  </nav>
</header>

<div class="layout">
  <aside id="sidebar">
    <h2>Documentation</h2>
    <div id="docList"></div>
  </aside>
  <main>
    <div class="content" id="content">
      <div class="loading">Loading…</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
// ---- Theme toggle ----
(function () {
  const btn = document.getElementById("themeBtn");
  function render() {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    btn.textContent = isLight ? "🌙 Dark" : "☀ Light";
  }
  btn.addEventListener("click", () => {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    if (isLight) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("impulse-bridge-theme", "dark");
    } else {
      document.documentElement.setAttribute("data-theme", "light");
      localStorage.setItem("impulse-bridge-theme", "light");
    }
    render();
  });
  render();
})();

// ---- Document set ----
const DOCS = [
  { file: "README.md",            num: "",   title: "Contents" },
  { file: "01-overview.md",       num: "01", title: "Overview" },
  { file: "02-architecture.md",   num: "02", title: "Architecture" },
  { file: "03-yaml-reference.md", num: "03", title: "YAML reference" },
  { file: "04-admin-ui.md",       num: "04", title: "Admin UI" },
  { file: "05-cookbook.md",       num: "05", title: "Cookbook" },
  { file: "06-operations.md",     num: "06", title: "Operations" },
  { file: "07-deployment.md",     num: "07", title: "Deployment" },
];

// ---- Sidebar render ----
function renderSidebar(activeFile) {
  const list = document.getElementById("docList");
  list.innerHTML = "";
  for (const d of DOCS) {
    const a = document.createElement("a");
    a.className = "doc-item" + (d.file === activeFile ? " active" : "");
    a.href = "#" + d.file;
    a.innerHTML = (d.num ? `<span class="num">${d.num}</span>` : "") + d.title;
    a.addEventListener("click", (e) => { e.preventDefault(); loadDoc(d.file); });
    list.appendChild(a);
  }
}

// ---- Document loading and rendering ----
async function loadDoc(filename) {
  // Update URL hash without scroll jump
  history.replaceState(null, "", "#" + filename);
  renderSidebar(filename);

  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">Loading…</div>';

  try {
    const r = await fetch("/help/files/" + encodeURIComponent(filename));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    const html = marked.parse(text, { gfm: true, breaks: false });
    content.innerHTML = '<div class="content-body">' + html + '</div>' + renderFooter(filename);

    // Intercept clicks on .md links so they navigate within the viewer.
    content.querySelectorAll("a").forEach(a => {
      const href = a.getAttribute("href") || "";
      if (href.match(/^[^/].*\.md$/i)) {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          loadDoc(href.split("#")[0]);
        });
      }
    });
    // Scroll to top
    document.querySelector("main").scrollTop = 0;
  } catch (e) {
    content.innerHTML = '<div class="error-box">Failed to load <code>' + filename + '</code>: ' + e.message + '</div>';
  }
}

function renderFooter(currentFile) {
  const idx = DOCS.findIndex(d => d.file === currentFile);
  const prev = idx > 0 ? DOCS[idx - 1] : null;
  const next = idx >= 0 && idx < DOCS.length - 1 ? DOCS[idx + 1] : null;
  let html = '<div class="nav-foot">';
  html += prev
    ? `<a href="#${prev.file}" onclick="event.preventDefault(); loadDoc('${prev.file}')">← ${prev.num} ${prev.title}</a>`
    : '<span></span>';
  html += next
    ? `<a href="#${next.file}" onclick="event.preventDefault(); loadDoc('${next.file}')">${next.num} ${next.title} →</a>`
    : '<span></span>';
  html += '</div>';
  return html;
}

// ---- Bootstrap ----
const initial = (location.hash || "#01-overview.md").slice(1);
const validFile = DOCS.find(d => d.file === initial) ? initial : "01-overview.md";
loadDoc(validFile);
</script>
</body>
</html>
